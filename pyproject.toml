[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sue"
dynamic = ["version"]
description = "Прототип механизма интеграции учётных данных формата 1С:Розница в систему управления эффективностью"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy==2.0.42",
    "alembic==1.16.4",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "jsonschema==4.25.0",
    "python-multipart==0.0.20",
    "jinja2==3.1.6",
    "psycopg2-binary==2.9.10",
    "fpdf2==2.8.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "pytest-randomly==3.16.0",
    "httpx==0.28.1",
    "ruff==0.12.7",
    "mypy==1.17.1",
    "types-jsonschema==4.25.0.20250809",
    "pre-commit==4.2.0",
]

[project.scripts]
sue-datagen = "sue.datagen.cli:main"
sue-emulator = "sue.emulator.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "sue.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sue = [
    "web/templates/*.html",
    "web/static/*",
    "web/static/vendor/*",
    "web/static/fonts/*",
    "db/*.sql",
]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "pg: тесты, требующие PostgreSQL (SUE_TEST_PG_URL)",
    "slow: длительные тесты (производительность)",
]
filterwarnings = [
    "error",
    # sqlalchemy может отдавать предупреждения сторонних библиотек
    "default::DeprecationWarning:sqlalchemy.*",
]

[tool.coverage.run]
source = ["sue"]
branch = true
omit = ["*/web/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["thesis"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["sue"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sue.domain.*", "sue.etl.*", "sue.adapter_1c.*", "sue.money", "sue.datagen.*"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "fpdf.*"]
ignore_missing_imports = true
